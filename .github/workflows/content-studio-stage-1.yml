name: Content Studio Stage 1

on:
  pull_request:
    paths:
      - "controllers/contentStudioImageController.js"
      - "controllers/platformContentStudioAIConfigController.js"
      - "models/company.js"
      - "models/contentStudioImageAsset.js"
      - "models/contentStudioImageAudit.js"
      - "scripts/migrateContentStudioAiKeys.js"
      - "services/contentStudio/**"
      - "tests/contentStudioCredentialEncryption.test.js"
      - "tests/contentStudioImageSecurity.integration.test.js"
      - "utils/contentStudioCredentialEncryption.js"
      - ".github/workflows/content-studio-stage-1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  content-studio-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Content Studio module syntax
        run: |
          node --check services/contentStudio/imageAssetService.js
          node --check controllers/platformContentStudioAIConfigController.js
          node --check models/company.js
          node --check services/contentStudio/imageNormalizationService.js
          node --check services/contentStudio/imageLifecycleService.js
          node --check services/contentStudio/imageLifecycleSchedulerService.js
          node --check index.js
          node --check controllers/contentStudioUsageController.js
          node --check routes/contentStudio.js
          node --check routes/platformAdmin.js
          node --check services/contentStudio/imageDeliveryService.js
          node --check scripts/migrateContentStudioImageVisibility.js

      - name: Run image delivery tests
        run: node --test tests/contentStudioImageDelivery.test.js

      - name: Run image normalization tests
        run: node --test tests/contentStudioImageNormalization.test.js

      - name: Run credential encryption tests
        run: node --test tests/contentStudioCredentialEncryption.test.js

      - name: Run tenant and reference integration tests
        run: node --test tests/contentStudioImageSecurity.integration.test.js
